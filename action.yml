name: "agentsh Safe execution"
description: "Executes an AI-generated pull request inside a restricted agentsh container shell."
inputs:
  agent:
    description: "The AI agent to run (e.g. claude, aider, sh)"
    required: true
    default: "claude"
  command:
    description: "The command the agent should execute"
    required: true
runs:
  using: "composite"
  steps:
    - name: Download agentsh CLI
      shell: bash
      run: |
        curl -sSL https://raw.githubusercontent.com/itsrohan-lang/stuntdouble/main/install.sh | bash
        echo "/usr/local/bin" >> $GITHUB_PATH
    
    - name: Run Agent in Sandbox
      shell: bash
      run: agentsh run ${{ inputs.agent }} --allow-unenforced-network -- ${{ inputs.command }}
